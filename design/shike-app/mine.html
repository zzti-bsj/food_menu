<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食刻 · 我的</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* —— 页面级样式（我的页 v1.1）—— */
  .page-title {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 600; letter-spacing: 2px;
    padding: var(--s2) var(--s5) var(--s3);
    display: flex; align-items: center; gap: 10px;
  }
  .page-title .seal { width: 30px; height: 30px; font-size: 15px; }

  /* 身份卡：封面级渐变 */
  .id-card {
    margin: 0 var(--s5);
    display: flex; align-items: center; gap: var(--s4);
    padding: var(--s5);
    border-radius: var(--r-l);
    background: linear-gradient(150deg, #3D5A7E 0%, #2E4A66 46%, var(--accent-deep) 100%);
    border: none;
    color: #fff;
    box-shadow: 0 4px 12px rgba(34,58,82,.28), 0 18px 44px rgba(34,58,82,.34);
    position: relative;
    overflow: hidden;
  }
  .id-card::before {
    content: "";
    position: absolute;
    right: -46px; top: -46px;
    width: 160px; height: 160px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.18);
  }
  .id-card::after {
    content: "";
    position: absolute;
    right: -24px; top: -24px;
    width: 160px; height: 160px;
    border-radius: 50%;
    border: 1.5px dashed rgba(255,255,255,.12);
  }
  .id-card .seal { width: 56px; height: 56px; font-size: 26px; border-radius: 16px; }
  .id-card h2 { font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: 1px; }
  .id-card p { font-size: 13px; color: rgba(255,255,255,.75); margin-top: 3px; }

  .pref-card { padding: var(--s3) var(--s4) var(--s4); }
  .pref-card .chips-like { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .chip.sel {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
    box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 32%, transparent);
  }
  .chip.add { border-style: dashed; color: var(--ink-3); }

  .setting-card { display: flex; flex-direction: column; }
  .setting-row {
    display: flex; align-items: center; gap: var(--s3);
    padding: 14px var(--s4);
    border-bottom: 1px dashed var(--line);
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-row .s-icon {
    width: 38px; height: 38px; flex: none;
    display: grid; place-items: center;
    background: var(--accent-soft);
    border-radius: 12px;
    color: var(--accent-deep);
  }
  .setting-row .grow { flex: 1; min-width: 0; }
  .setting-row h3 { font-size: 15px; font-weight: 700; }
  .setting-row .s-sub { font-size: 13px; color: var(--ink-3); margin-top: 2px; }

  .switch { position: relative; display: inline-block; width: 51px; height: 31px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .track {
    position: absolute; inset: 0;
    background: var(--line-strong); border-radius: 999px;
    transition: background var(--dur) var(--ease);
  }
  .switch .track::after {
    content: "";
    position: absolute; top: 2px; left: 2px;
    width: 27px; height: 27px; border-radius: 999px;
    background: #fff; box-shadow: 0 1px 3px rgba(38,35,28,.25);
    transition: transform var(--dur) var(--ease);
  }
  .switch input:checked + .track { background: var(--success); }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  .about-list { padding: var(--s2) var(--s4); }
  .about-row {
    display: flex; justify-content: space-between; gap: var(--s3);
    padding: 12px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 15px;
  }
  .about-row:last-child { border-bottom: none; }
  .about-row span { color: var(--ink-2); }
  .about-row em { font-style: normal; color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }

  .data-note {
    margin-top: var(--s3);
    font-size: 13px; line-height: 1.7; color: var(--ink-3);
    padding: 0 var(--s5);
  }
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/><path d="M2 21c0-3 1.9-5.4 5.1-6C9.5 14.5 12 13 13 12"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
</svg>

<div class="phone">
  <div class="statusbar" aria-hidden="true">
    <span>9:41</span>
    <span style="display:flex;gap:6px;align-items:center">
      <svg width="18" height="12" viewBox="0 0 18 12"><path d="M1 11h2V8H1v3zm4 0h2V6H5v5zm4 0h2V4H9v7zm4 0h2V1h-2v10z" fill="currentColor"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.5a9.5 9.5 0 0 1 13 0"/><path d="M4 7a6 6 0 0 1 8 0"/><path d="M6.5 9.5a3 3 0 0 1 3 0"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>

  <div class="screen">
    <h1 class="page-title"><span class="seal" aria-hidden="true">吾</span>我的</h1>

    <!-- 本地身份（无账号体系） -->
    <div class="id-card">
      <span class="seal" aria-hidden="true">食</span>
      <div>
        <h2>本地食单</h2>
        <p>数据存于本机 · 无需账号</p>
      </div>
    </div>

    <!-- 口味与忌口 -->
    <section class="section" aria-labelledby="sec-pref">
      <div class="section-head"><h2 id="sec-pref">口味与忌口</h2></div>
      <div class="page-pad">
        <div class="card pref-card">
          <div class="chips-like" role="group" aria-label="口味偏好">
            <button class="chip sel" aria-pressed="true">少油</button>
            <button class="chip sel" aria-pressed="true">不嗜辣</button>
            <button class="chip sel" aria-pressed="true">忌海鲜</button>
            <button class="chip add" aria-pressed="false">＋ 添加</button>
          </div>
          <p style="font-size:13px;color:var(--ink-3);margin-top:10px">仅存于本机，用于菜谱排序与忌口提示。</p>
        </div>
      </div>
    </section>

    <!-- 节气提醒 -->
    <section class="section" aria-labelledby="sec-remind">
      <div class="section-head"><h2 id="sec-remind">节气提醒</h2></div>
      <div class="page-pad">
        <div class="card setting-card">
          <div class="setting-row">
            <span class="s-icon" aria-hidden="true"><svg width="19" height="19"><use href="#i-bell"/></svg></span>
            <div class="grow">
              <h3>入节提醒</h3>
              <p class="s-sub">入节当天 07:00 · 推送当令食材与菜谱</p>
            </div>
            <span class="switch">
              <input type="checkbox" role="switch" aria-label="入节提醒" checked>
              <span class="track"></span>
            </span>
          </div>
        </div>
      </div>
    </section>

    <!-- 数据说明 -->
    <section class="section" aria-labelledby="sec-data">
      <div class="section-head"><h2 id="sec-data">数据说明</h2></div>
      <div class="page-pad">
        <div class="card about-list">
          <div class="about-row"><span>内容来源</span><em>健康厨师 AI 生成 · 人工逐条审核收录</em></div>
          <div class="about-row"><span>词表版本</span><em>性味归经 / 功效 / 节气 · v1.0</em></div>
          <div class="about-row"><span>食材档案</span><em>已收录 186 种</em></div>
          <div class="about-row"><span>菜谱</span><em>已收录 64 道</em></div>
        </div>
        <p class="data-note">养生内容为日常饮食参考，不构成医疗建议；身体不适请及时就医。</p>
      </div>
    </section>

    <!-- 关于 -->
    <section class="section" aria-labelledby="sec-about">
      <div class="section-head"><h2 id="sec-about">关于</h2></div>
      <div class="page-pad">
        <div class="card about-list">
          <div class="about-row"><span>食刻 · 二十四节气菜谱</span><em>版本 0.1.0</em></div>
        </div>
      </div>
    </section>
  </div>

  <nav class="tabbar" aria-label="主导航">
    <a href="home.html">
      <svg width="24" height="24" aria-hidden="true"><use href="#i-sun"/></svg><span>今日</span>
    </a>
    <a href="recipes.html">
      <svg width="24" height="24" aria-hidden="true"><use href="#i-book"/></svg><span>菜谱</span>
    </a>
    <a href="ingredients.html">
      <svg width="24" height="24" aria-hidden="true"><use href="#i-leaf"/></svg><span>食材</span>
    </a>
    <a href="mine.html" aria-current="page">
      <svg width="24" height="24" aria-hidden="true"><use href="#i-user"/></svg><span>我的</span>
    </a>
  </nav>

  <div class="home-indicator" aria-hidden="true"></div>
</div>

</body>
</html>
