<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食刻 · 工坊</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* —— 页面级样式（工坊首页：LLM 流水线 + 审核台入口）—— */
  .page-title {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 600; letter-spacing: 2px;
    padding: var(--s2) var(--s5) var(--s3);
    display: flex; align-items: center; gap: 10px;
  }
  .page-title .seal { width: 30px; height: 30px; font-size: 15px; }

  /* 流水线入口大卡 */
  .pipe-card {
    display: flex; align-items: center; gap: var(--s4);
    margin: 0 var(--s5) var(--s3);
    padding: var(--s5);
    border-radius: var(--r-l);
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: var(--shadow-card);
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
    transition: transform 100ms var(--ease), box-shadow var(--dur) var(--ease);
  }
  .pipe-card:active { transform: scale(.98); box-shadow: var(--shadow-lift); }
  .pipe-card .p-icon {
    flex: none;
    width: 52px; height: 52px;
    display: grid; place-items: center;
    border-radius: 16px;
    background: var(--surface);
    box-shadow: 0 2px 8px rgba(38,35,28,.08);
  }
  .pipe-card h2 { font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: 1px; }
  .pipe-card .p-sub { font-size: 13px; color: var(--ink-3); margin-top: 3px; line-height: 1.6; }
  .pipe-card .chev { margin-left: auto; color: var(--ink-3); flex: none; }
  .pipe-card .sticker { position: absolute; right: 14px; top: 14px; }

  /* 状态行卡 */
  .stat-card {
    margin: 0 var(--s5) var(--s3);
    padding: var(--s4);
  }
  .stat-card .s-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--s3);
  }
  .stat-card .s-head b { font-size: 15px; font-weight: 700; }
  .stat-card .s-head a { font-size: 13px; color: var(--accent-deep); font-weight: 700; text-decoration: none; padding: 6px 0 6px 8px; }
  .stat-chips { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .stat-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700;
    border-radius: 999px; padding: 6px 12px;
  }
  .sc-ok   { background: var(--spring-soft); color: var(--spring-deep); }
  .sc-warn { background: var(--autumn-soft); color: var(--autumn-deep); }
  .sc-bad  { background: var(--danger-soft); color: var(--danger); }
  .sc-info { background: var(--winter-soft); color: var(--winter-deep); }

  .hint {
    margin: var(--s2) var(--s5) 0;
    font-size: 13px; line-height: 1.7; color: var(--ink-3);
  }
  .hint b { color: var(--ink-2); }
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/><path d="M2 21c0-3 1.9-5.4 5.1-6C9.5 14.5 12 13 13 12"/></symbol>
  <symbol id="i-tools" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v5.2L4.9 17.4A2 2 0 0 0 6.7 20h10.6a2 2 0 0 0 1.8-2.6L14 8.2V3"/><path d="M7.5 13h9"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-bowl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-9 9 9 9 0 0 1-9-9z"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></symbol>
</svg>

<div class="phone">
  <div class="statusbar" aria-hidden="true">
    <span>9:41</span>
    <span style="display:flex;gap:6px;align-items:center">
      <svg width="18" height="12" viewBox="0 0 18 12"><path d="M1 11h2V8H1v3zm4 0h2V6H5v5zm4 0h2V4H9v7zm4 0h2V1h-2v10z" fill="currentColor"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.5a9.5 9.5 0 0 1 13 0"/><path d="M4 7a6 6 0 0 1 8 0"/><path d="M6.5 9.5a3 3 0 0 1 3 0"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>

  <div class="screen">
    <h1 class="page-title"><span class="seal" aria-hidden="true">坊</span>工坊</h1>

    <!-- 食材流水线入口 -->
    <a class="pipe-card panel-pop spring" href="pipeline.html">
      <span class="p-icon" style="color:var(--spring-deep)" aria-hidden="true"><svg width="26" height="26"><use href="#i-leaf"/></svg></span>
      <div>
        <h2>食材流水线</h2>
        <p class="p-sub">选一个节气，批量推荐食材并生成档案<br>推荐 → 填充 → 校验 → 核验 → 入库待审核</p>
      </div>
      <svg class="chev" width="20" height="20" aria-hidden="true"><use href="#i-chevron-right"/></svg>
    </a>

    <!-- 菜品生成入口 -->
    <a class="pipe-card panel-pop autumn" href="dish-generate.html">
      <span class="p-icon" style="color:var(--autumn-deep)" aria-hidden="true"><svg width="26" height="26"><use href="#i-bowl"/></svg></span>
      <div>
        <h2>菜品生成 · 健康厨师</h2>
        <p class="p-sub">丢入候选食材，AI 设计一道健康低卡的菜<br>生成 → 校验 → 核验（存疑写入备注）→ 入库待审核</p>
      </div>
      <svg class="chev" width="20" height="20" aria-hidden="true"><use href="#i-chevron-right"/></svg>
      <span class="sticker" style="position:absolute">新</span>
    </a>

    <!-- 最近批次 -->
    <div class="card stat-card">
      <div class="s-head">
        <b>最近批次 · 立冬</b>
        <a href="pipeline.html">查看 <svg width="12" height="12" style="vertical-align:-1px" aria-hidden="true"><use href="#i-chevron-right"/></svg></a>
      </div>
      <div class="stat-chips">
        <span class="stat-chip sc-info">推荐 6 个候选</span>
        <span class="stat-chip sc-ok">入库 4</span>
        <span class="stat-chip sc-warn">存疑 1</span>
        <span class="stat-chip sc-bad">失败 1</span>
      </div>
    </div>

    <!-- 审核待办 -->
    <div class="card stat-card">
      <div class="s-head">
        <b>审核待办</b>
        <a href="review.html">去审核 <svg width="12" height="12" style="vertical-align:-1px" aria-hidden="true"><use href="#i-chevron-right"/></svg></a>
      </div>
      <div class="stat-chips">
        <span class="stat-chip sc-info">待审核 6 条</span>
        <span class="stat-chip">食材 3 · 菜品 3</span>
        <span class="stat-chip sc-warn">含存疑 2</span>
      </div>
    </div>

    <p class="hint">
      示例数据 · 工坊覆盖单件流转与快速处理；大批量作业建议使用桌面端审核台。
      所有生成内容需<b>人工终审</b>后才进入 C 端。
    </p>
  </div>

  <nav class="tabbar" aria-label="主导航">
    <a href="home.html">
      <svg width="24" height="24" aria-hidden="true"><use href="#i-sun"/></svg><span>今日</span>
    </a>
    <a href="recipes.html">
      <svg width="24" height="24" aria-hidden="true"><use href="#i-book"/></svg><span>菜谱</span>
    </a>
    <a href="ingredients.html">
      <svg width="24" height="24" aria-hidden="true"><use href="#i-leaf"/></svg><span>食材</span>
    </a>
    <a href="workshop.html" aria-current="page">
      <svg width="24" height="24" aria-hidden="true"><use href="#i-tools"/></svg><span>工坊</span>
    </a>
    <a href="mine.html">
      <svg width="24" height="24" aria-hidden="true"><use href="#i-user"/></svg><span>我的</span>
    </a>
  </nav>

  <div class="home-indicator" aria-hidden="true"></div>
</div>

</body>
</html>
