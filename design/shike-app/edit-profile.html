<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食刻 · 编辑资料</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* —— 页面级样式（编辑资料：头像 + 昵称；PATCH /api/auth/me）
     昵称 1–50 字；头像字段规划中（user 表暂无 avatar 列，接口待补）。 */
  .block { margin: 0 var(--s5) var(--s3); }
  .block-label {
    font-size: 13px; color: var(--ink-3);
    margin-bottom: var(--s2);
  }

  /* 头像编辑 */
  .avatar-block {
    display: flex; flex-direction: column; align-items: center; gap: var(--s3);
    padding: var(--s5) 0 var(--s4);
  }
  .avatar-big {
    position: relative;
    width: 96px; height: 96px;
    border-radius: 999px;
    display: grid; place-items: center;
    background: var(--seal);
    color: #fff;
    font-family: var(--font-display);
    font-size: 38px; font-weight: 600;
    box-shadow: 0 4px 14px rgba(176,58,46,.3);
  }
  .avatar-big .cam {
    position: absolute; right: 0; bottom: 0;
    width: 32px; height: 32px;
    border-radius: 999px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    display: grid; place-items: center;
    color: var(--ink-2);
    box-shadow: 0 1px 4px rgba(38,35,28,.12);
  }
  .avatar-btn {
    font: inherit; font-size: 14px; font-weight: 700;
    color: var(--accent-deep);
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 10px;
  }
  .avatar-btn:active { background: var(--accent-soft); }
  .avatar-hint { font-size: 12px; color: var(--ink-3); text-align: center; line-height: 1.6; }

  /* 表单 */
  .field-card { padding: var(--s2) var(--s4); }
  .field-row {
    display: flex; align-items: center; gap: var(--s3);
    padding: 13px 0;
    border-bottom: 1px dashed var(--line);
  }
  .field-row:last-child { border-bottom: none; }
  .field-row .k {
    flex: none; width: 76px;
    font-size: 13px; font-weight: 700; color: var(--ink-3);
  }
  .field-row .v { flex: 1; min-width: 0; }
  .field-row input {
    width: 100%;
    border: none; outline: none; background: none;
    font: inherit; font-size: 15px;
    color: var(--ink);
  }
  .field-row input::placeholder { color: var(--ink-3); }
  .field-row .ro { font-size: 15px; color: var(--ink-2); }
  .field-row .ro .lock { font-size: 12px; color: var(--ink-3); margin-left: 6px; }
  .field-row .counter {
    flex: none;
    font-size: 12px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .err { font-size: 12px; color: var(--danger); margin-top: 5px; display: flex; align-items: center; gap: 5px; }

  .hint { margin: var(--s4) var(--s5) 0; font-size: 13px; line-height: 1.7; color: var(--ink-3); }
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
</svg>

<div class="phone">
  <div class="statusbar" aria-hidden="true">
    <span>9:41</span>
    <span style="display:flex;gap:6px;align-items:center">
      <svg width="18" height="12" viewBox="0 0 18 12"><path d="M1 11h2V8H1v3zm4 0h2V6H5v5zm4 0h2V4H9v7zm4 0h2V1h-2v10z" fill="currentColor"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.5a9.5 9.5 0 0 1 13 0"/><path d="M4 7a6 6 0 0 1 8 0"/><path d="M6.5 9.5a3 3 0 0 1 3 0"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>

  <div class="screen no-tabbar">
    <header class="nav-header">
      <a class="icon-btn" href="mine.html" aria-label="返回我的">
        <svg width="22" height="22" aria-hidden="true"><use href="#i-chevron-left"/></svg>
      </a>
      <h1 style="font-family:var(--font-display);font-size:20px;font-weight:600">编辑资料</h1>
      <button type="button" style="margin-left:auto;font:inherit;font-size:14px;font-weight:700;color:var(--accent-deep);background:none;border:none;cursor:pointer;padding:8px">保存</button>
    </header>

    <!-- 头像 -->
    <div class="avatar-block">
      <span class="avatar-big" aria-hidden="true">
        时
        <span class="cam"><svg width="15" height="15"><use href="#i-camera"/></svg></span>
      </span>
      <button class="avatar-btn" type="button">更换头像</button>
      <p class="avatar-hint">支持 JPG / PNG · 头像字段规划中（user.avatar，接口待补）</p>
    </div>

    <!-- 资料字段 -->
    <div class="block">
      <p class="block-label">资料 · PATCH /api/auth/me</p>
      <div class="card field-card">
        <div class="field-row">
          <span class="k">昵称</span>
          <div class="v" style="display:flex;align-items:center;gap:8px">
            <input type="text" maxlength="50" value="阿时" aria-label="昵称（1–50 字）">
            <span class="counter">2/50</span>
          </div>
        </div>
        <div class="field-row">
          <span class="k">手机号</span>
          <div class="v ro">138****4829<span class="lock">不可修改</span></div>
        </div>
        <div class="field-row">
          <span class="k">角色</span>
          <div class="v ro">管理员（admin）<span class="lock">由管理员分配</span></div>
        </div>
      </div>
      <!-- 错误态示例 -->
      <p class="err" role="alert" style="margin-top:10px;padding:0 var(--s2)">
        <svg width="14" height="14" aria-hidden="true"><use href="#i-alert"/></svg>
        nickname 须为1-50字
      </p>
    </div>

    <p class="hint">
      保存即提交 PATCH /api/auth/me（仅 nickname 可改；改密码在登录页「忘记密码」流程，见后端说明）。
      示例错误文案对齐接口返回。
    </p>
  </div>

  <div class="home-indicator" aria-hidden="true"></div>
</div>

</body>
</html>
