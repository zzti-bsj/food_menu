<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食刻 · 我的</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* —— 页面级样式（我的页 v1.4.3：资料头部 + 入口列表，主流范式）
     身份数据 GET /api/auth/me；点头像/资料区 → 编辑资料（PATCH /api/auth/me）。 */
  .page-title-lbl {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 600; letter-spacing: 2px;
    padding: var(--s2) var(--s5) var(--s3);
  }
  .gear {
    position: absolute;
    top: 52px; right: 16px;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: var(--r-s);
    color: var(--ink-2);
    text-decoration: none;
    transition: background var(--dur) var(--ease);
  }
  .gear:active { background: rgba(38,35,28,.06); }

  /* 资料头部（可点 → 编辑资料） */
  .profile {
    display: flex; align-items: center; gap: var(--s4);
    margin: var(--s2) var(--s5) var(--s4);
    padding: var(--s5);
    border-radius: var(--r-l);
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: var(--shadow-card);
    position: relative;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform 100ms var(--ease);
  }
  .profile:active { transform: scale(.98); }
  .profile::before {
    content: "";
    position: absolute;
    right: -46px; top: -46px;
    width: 160px; height: 160px;
    border-radius: 50%;
    border: 2px dashed rgba(255,255,255,.95);
  }
  .avatar-wrap { position: relative; flex: none; }
  .avatar {
    width: 64px; height: 64px;
    border-radius: 999px;
    display: grid; place-items: center;
    background: var(--seal);
    color: #fff;
    font-family: var(--font-display);
    font-size: 26px; font-weight: 600;
    box-shadow: 0 3px 10px rgba(176,58,46,.3);
  }
  .avatar-cam {
    position: absolute; right: -2px; bottom: -2px;
    width: 22px; height: 22px;
    border-radius: 999px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    display: grid; place-items: center;
    color: var(--ink-3);
  }
  .profile .grow { flex: 1; min-width: 0; }
  .profile h2 {
    font-family: var(--font-display);
    font-size: 20px; font-weight: 600; letter-spacing: 1px;
    color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  .role-badge {
    font-size: 10px; font-weight: 800;
    border-radius: 6px; padding: 3px 6px;
    font-family: var(--font-body);
    letter-spacing: 0;
  }
  .role-admin { background: var(--seal); color: #fff; }
  .profile .pid { font-size: 13px; color: var(--ink-3); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .profile .chev { margin-left: auto; flex: none; color: var(--ink-3); }

  /* 入口列表 */
  .entry-group {
    margin: 0 var(--s5) var(--s4);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-m);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  .entry-row {
    display: flex; align-items: center; gap: var(--s3);
    padding: 13px var(--s4);
    border-bottom: 1px dashed var(--line);
    text-decoration: none;
    color: inherit;
    transition: background var(--dur) var(--ease);
  }
  .entry-row:last-child { border-bottom: none; }
  .entry-row:active { background: var(--surface-2); }
  .entry-row .e-icon {
    width: 36px; height: 36px; flex: none;
    display: grid; place-items: center;
    background: var(--accent-soft);
    border-radius: 10px;
    color: var(--accent-deep);
  }
  .entry-row .e-icon.amber { background: var(--autumn-soft); color: var(--autumn-deep); }
  .entry-row .e-icon.rose { background: var(--summer-soft); color: var(--summer-deep); }
  .entry-row .grow { flex: 1; min-width: 0; }
  .entry-row h3 { font-size: 15px; font-weight: 600; }
  .entry-row .e-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .entry-row .e-count {
    font-size: 12px; font-weight: 700;
    color: var(--ink-2);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 9px;
    font-variant-numeric: tabular-nums;
  }
  .entry-row .e-tag {
    font-size: 10px; font-weight: 800;
    color: var(--summer-deep);
    background: var(--summer-soft);
    border-radius: 6px;
    padding: 3px 7px;
    flex: none;
  }
  .entry-row svg.e-chev { margin-left: auto; flex: none; color: var(--ink-3); }
</style>
</head>

  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.5"/></symbol>
</svg>
