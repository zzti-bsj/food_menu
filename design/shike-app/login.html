<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食刻 · 登录</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* —— 页面级样式（登录/注册：POST /api/auth/register、/api/auth/login）
     register：phone 须 1 开头 11 位、password ≥6；409 手机号已注册
     login：401 手机号或密码不正确 / 账号已禁用；成功返回 token(access 2h)+refresh_token(30天)+user */
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

  .brand {
    display: flex; flex-direction: column; align-items: center; gap: var(--s3);
    padding: var(--s6) var(--s5) var(--s5);
    text-align: center;
  }
  .brand .seal { width: 56px; height: 56px; font-size: 26px; border-radius: 16px; }
  .brand h1 {
    font-family: var(--font-display);
    font-size: 26px; font-weight: 600; letter-spacing: 4px;
  }
  .brand p { font-size: 13px; color: var(--ink-3); letter-spacing: 1px; }

  /* 登录/注册切换 */
  .seg {
    display: flex; gap: 4px;
    margin: 0 var(--s5) var(--s4);
    padding: 4px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .seg button {
    flex: 1;
    height: 38px;
    border: none;
    border-radius: 999px;
    background: none;
    font: inherit; font-size: 14px; font-weight: 600;
    color: var(--ink-3);
    cursor: pointer;
  }
  .seg button[aria-selected="true"] {
    background: var(--surface);
    color: var(--ink);
    font-weight: 700;
    box-shadow: 0 1px 4px rgba(38,35,28,.12);
  }

  /* 表单 */
  form { display: block; margin: 0 var(--s5); }
  .field { margin-bottom: var(--s4); }
  .field label {
    display: block;
    font-size: 13px; font-weight: 700; color: var(--ink-2);
    margin-bottom: 6px;
  }
  .field label em { font-style: normal; color: var(--danger); margin-left: 2px; }
  .control {
    display: flex; align-items: center; gap: var(--s2);
    height: 48px;
    padding: 0 var(--s3);
    background: var(--surface);
    border: 1.5px solid var(--line-strong);
    border-radius: 14px;
    transition: border-color var(--dur) var(--ease);
  }
  .control:focus-within { border-color: var(--accent); }
  .control input {
    flex: 1; min-width: 0;
    border: none; outline: none; background: none;
    font: inherit; font-size: 16px;
    color: var(--ink);
  }
  .control input::placeholder { color: var(--ink-3); }
  .eye {
    flex: none;
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border: none; background: none;
    border-radius: 10px;
    color: var(--ink-3);
    cursor: pointer;
  }
  .helper { font-size: 12px; color: var(--ink-3); margin-top: 5px; line-height: 1.6; }
  .error {
    display: flex; align-items: center; gap: 6px;
    margin-top: 5px;
    font-size: 12px; font-weight: 600; color: var(--danger);
  }
  .submit { width: 100%; margin-top: var(--s2); }

  .sync-note {
    margin: var(--s4) var(--s6) 0;
    font-size: 12px; line-height: 1.7; color: var(--ink-3);
    text-align: center;
  }
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7c2.1 0 3.9.7 5.4 1.6M22 12s-3.5 7-10 7c-2.1 0-3.9-.7-5.4-1.6"/><path d="M3 3l18 18"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
</svg>

<div class="phone">
  <div class="statusbar" aria-hidden="true">
    <span>9:41</span>
    <span style="display:flex;gap:6px;align-items:center">
      <svg width="18" height="12" viewBox="0 0 18 12"><path d="M1 11h2V8H1v3zm4 0h2V6H5v5zm4 0h2V4H9v7zm4 0h2V1h-2v10z" fill="currentColor"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.5a9.5 9.5 0 0 1 13 0"/><path d="M4 7a6 6 0 0 1 8 0"/><path d="M6.5 9.5a3 3 0 0 1 3 0"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>

  <div class="screen no-tabbar">
    <!-- 品牌 -->
    <div class="brand">
      <span class="seal" aria-hidden="true">食</span>
      <h1>登录食刻</h1>
      <p>顺时饮食 · 私有食单云同步</p>
    </div>

    <!-- 登录/注册切换（点选切换表单） -->
    <div class="seg" role="tablist" aria-label="登录或注册">
      <button role="tab" aria-selected="true" data-auth-btn="login">登录</button>
      <button role="tab" aria-selected="false" data-auth-btn="register">注册</button>
    </div>

    <!-- 登录表单 -->
    <div data-auth-panel="login">
    <form aria-labelledby="f-login">
      <h2 class="sr-only" id="f-login">登录</h2>
      <div class="field">
        <label for="login-phone">手机号<em aria-hidden="true">*</em></label>
        <div class="control">
          <input id="login-phone" name="phone" type="tel" inputmode="numeric" maxlength="11"
                 placeholder="1 开头的 11 位数字" autocomplete="username" value="13812344829">
        </div>
      </div>
      <div class="field">
        <label for="login-pwd">密码<em aria-hidden="true">*</em></label>
        <div class="control">
          <input id="login-pwd" name="password" type="password" placeholder="至少 6 位"
                 autocomplete="current-password" value="shike2026">
          <button class="eye" type="button" aria-label="显示密码">
            <svg width="20" height="20" aria-hidden="true"><use href="#i-eye-off"/></svg>
          </button>
        </div>
        <p class="helper">密码至少 6 位 · 可使用密码管理器与粘贴
          <a href="#" style="color:var(--accent-deep);font-weight:700;text-decoration:none;margin-left:4px">忘记密码？</a>
        </p>
        <p class="helper" style="margin-top:2px">重置流程依赖短信验证码 · 接口待补（当前后端仅支持登录后在「编辑资料」修改昵称，改密接口见上）</p>
        <!-- 错误态示例（对齐接口文案） -->
        <p class="error" role="alert">
          <svg width="14" height="14" aria-hidden="true"><use href="#i-alert"/></svg>
          手机号或密码不正确
        </p>
      </div>
      <button class="btn btn-primary submit" type="submit">登录</button>
    </form>
    </div>

    <!-- 注册表单（点「注册」Tab 显示） -->
    <div data-auth-panel="register" hidden>
    <form aria-labelledby="f-register">
      <h2 class="sr-only" id="f-register">注册</h2>
      <div class="field">
        <label for="reg-phone">手机号<em aria-hidden="true">*</em></label>
        <div class="control">
          <input id="reg-phone" name="phone" type="tel" inputmode="numeric" maxlength="11"
                 placeholder="1 开头的 11 位数字" autocomplete="username">
        </div>
        <p class="helper">仅用于登录与找回，不对外展示（他人看到的是昵称或掩码）</p>
      </div>
      <div class="field">
        <label for="reg-pwd">设置密码<em aria-hidden="true">*</em></label>
        <div class="control">
          <input id="reg-pwd" name="password" type="password" placeholder="至少 6 位"
                 autocomplete="new-password">
          <button class="eye" type="button" aria-label="显示密码">
            <svg width="20" height="20" aria-hidden="true"><use href="#i-eye"/></svg>
          </button>
        </div>
        <!-- 错误态示例（对齐接口文案） -->
        <p class="error" role="alert">
          <svg width="14" height="14" aria-hidden="true"><use href="#i-alert"/></svg>
          手机号已注册：13812344829
        </p>
      </div>
      <button class="btn btn-primary submit" type="submit">注册并登录</button>
    </form>
    </div>

    <p class="sync-note" style="margin-top:var(--s5)">
      登录后可使用私有食单（仅本人可见）、云同步与审核协作。<br>
      未登录也可浏览官方库全部内容。
    </p>
  </div>

  <div class="home-indicator" aria-hidden="true"></div>
</div>

<script>
  // 登录/注册 Tab 切换：点选切换表单（与菜品生成页同款交互）
  const authBtns = document.querySelectorAll('[data-auth-btn]');
  const authPanels = document.querySelectorAll('[data-auth-panel]');
  authBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.authBtn;
      authBtns.forEach(b => b.setAttribute('aria-selected', String(b.dataset.authBtn === target)));
      authPanels.forEach(p => { p.hidden = p.dataset.authPanel !== target; });
    });
  });
</script>

</body>
</html>
