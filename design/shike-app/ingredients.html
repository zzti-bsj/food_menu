<style>
  /* —— 页面级样式（食材百科页 v1.3：插画档案卡）—— */
  .page-title {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 600; letter-spacing: 2px;
    padding: var(--s2) var(--s5) var(--s3);
    display: flex; align-items: center; gap: 10px;
  }
  .page-title .seal { width: 30px; height: 30px; font-size: 15px; }

  .filter-label {
    padding: 0 var(--s5);
    font-size: 13px; color: var(--ink-3);
    margin: var(--s2) 0 2px;
  }

  /* 只看当令 */
  .term-toggle {
    display: flex; align-items: center; justify-content: space-between;
    margin: var(--s3) var(--s5) 0;
    padding: 12px var(--s4);
    background: linear-gradient(150deg, var(--winter-soft) 0%, var(--surface) 62%);
    border: 1px solid var(--line);
    border-radius: var(--r-m);
    box-shadow: var(--shadow-card);
  }
  .term-toggle .tt-label { font-size: 15px; font-weight: 700; }
  .term-toggle .tt-sub { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
  .switch { position: relative; display: inline-block; width: 51px; height: 31px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .track {
    position: absolute; inset: 0;
    background: var(--line-strong); border-radius: 999px;
    transition: background var(--dur) var(--ease);
  }
  .switch .track::after {
    content: "";
    position: absolute; top: 2px; left: 2px;
    width: 27px; height: 27px; border-radius: 999px;
    background: #fff; box-shadow: 0 1px 3px rgba(38,35,28,.25);
    transition: transform var(--dur) var(--ease);
  }
  .switch input:checked + .track { background: var(--success); }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  .result-line {
    padding: var(--s4) var(--s5) var(--s2);
    font-size: 13px; color: var(--ink-3);
  }

  /* —— 食材插画档案卡（双列网格）—— */
  .ing-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--s3);
    padding: 0 var(--s5);
  }
  .ing-card {
    display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-m);
    box-shadow: var(--shadow-card);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform 100ms var(--ease), box-shadow var(--dur) var(--ease);
  }
  .ing-card:active { transform: scale(.97); box-shadow: var(--shadow-lift); }

  /* 图像舞台：默认占位图（可上传替换，规划 ingredient.image 字段） */
  .stage {
    position: relative;
    height: 104px;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: linear-gradient(160deg, var(--surface-2) 0%, #F3EFE3 100%);
    border-bottom: 1px solid var(--line);
  }
  .stage .ph {
    width: 76px; height: 76px;
    border-radius: 999px;
    display: grid; place-items: center;
    background: var(--surface);
    border: 1.5px dashed var(--line-strong);
    color: var(--ink-3);
  }
  .stage .when {
    position: absolute; left: 10px; top: 10px;
  }
  .stage .ph-tip {
    position: absolute; right: 10px; bottom: 8px;
    font-size: 10px; color: var(--ink-3);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 3px 6px;
  }

  .ing-card .body { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .ing-card .name-row { display: flex; align-items: baseline; gap: 6px; }
  .ing-card h3 { font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: 1px; }
  .ing-card .alias { font-size: 11px; color: var(--ink-3); }
  .ing-card .badges { display: flex; gap: 5px; flex-wrap: wrap; }
  .ing-card .ben {
    font-size: 12px; line-height: 1.6; color: var(--ink-2);
    border-top: 1px dashed var(--line);
    padding-top: 8px; margin-top: auto;
  }
</style>
</head>
